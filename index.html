<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Business Schedule C Tracker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #dcfce7;
      --warning: #b45309;
      --warning-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .sync-badge.synced {
      background: var(--success-soft);
      color: var(--success);
      border-color: #bbf7d0;
    }
    .sync-badge.syncing {
      background: var(--warning-soft);
      color: var(--warning);
      border-color: #fde68a;
    }
    .sync-badge.error {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #fecaca;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    select, input, textarea, button {
      font-family: inherit;
      font-size: 0.9rem;
    }
    select, input, textarea {
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--surface-muted); }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger {
      color: var(--danger);
      border-color: #fecaca;
      background: #fff;
    }
    .btn-danger:hover { background: var(--danger-soft); }
    .btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
    }

    /* Main Container & Tabs */
    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px 60px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      padding-bottom: 2px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 16px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Cards & Grids */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }
    .kpi-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .kpi-value {
      font-size: 1.55rem;
      font-weight: 700;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    .kpi-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }
    .text-primary { color: var(--primary); }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--surface-muted);
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    tr:hover td { background: #f8fafc; }
    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-income { background: var(--success-soft); color: var(--success); }
    .badge-expense { background: var(--danger-soft); color: var(--danger); }
    .badge-mileage { background: var(--primary-soft); color: var(--primary); }

    .line-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 5px;
      color: var(--text);
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .toolbar-left, .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 0.92rem;
    }
    .notice-box {
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>Music Business Schedule C Tracker</h1>
      <p>Shared cloud ledger • Synced to Google Sheets for Schedule C & TurboTax</p>
    </div>
    <div class="header-controls">
      <div id="syncStatus" class="sync-badge">
        <span class="dot"></span>
        <span id="syncText">Connecting...</span>
      </div>
      <label for="taxYearSelect" style="font-size:0.82rem;font-weight:600;color:var(--text-muted);">Tax Year:</label>
      <select id="taxYearSelect">
        <option value="2026" selected>2026 ($0.725/mi)</option>
        <option value="2025">2025 ($0.70/mi)</option>
        <option value="2024">2024 ($0.67/mi)</option>
        <option value="ALL">All Years</option>
      </select>
      <button class="btn btn-sm" id="refreshBtn" title="Pull latest from Google Sheet">↻ Refresh</button>
    </div>
  </div>
</header>

<main>
  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="transactions">1. Transactions</button>
    <button class="tab-btn" data-tab="summary">2. Annual Summary</button>
    <button class="tab-btn" data-tab="turbotax">3. TurboTax Worksheet</button>
    <button class="tab-btn" data-tab="assets">4. Asset Log</button>
    <button class="tab-btn" data-tab="forms1099">5. 1099s</button>
  </nav>

  <!-- TAB 1: TRANSACTIONS -->
  <section id="tab-transactions" class="tab-panel active">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title" id="txFormTitle">Log New Entry</h2>
        <button class="btn btn-sm" id="cancelEditTxBtn" style="display:none;">Cancel Edit</button>
      </div>
      <form id="txForm" class="form-grid">
        <input type="hidden" id="txId" />
        <div class="form-group">
          <label for="txDate">Date</label>
          <input type="date" id="txDate" required />
        </div>
        <div class="form-group">
          <label for="txType">Entry Type</label>
          <select id="txType" required>
            <option value="Expense">Expense</option>
            <option value="Income">Income (Gigs / Royalties / Lessons)</option>
            <option value="Mileage">Business Mileage (Miles)</option>
          </select>
        </div>
        <div class="form-group" id="txCategoryGroup">
          <label for="txCategory">Schedule C Category
